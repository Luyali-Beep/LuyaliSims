<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Neon Glow Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="100%" stop-color="#bc13fe"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#00f3ff" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Dark Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  
  <!-- Outer Neon Border -->
  <rect width="62" height="62" x="1" y="1" rx="13" fill="none" stroke="#00f3ff" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Futuristic Angular Letter "L" -->
  <path d="M 22 14 
           L 29 14 
           L 29 42 
           L 44 42 
           L 44 49 
           L 22 49 Z" 
        fill="url(#neonGrad)" 
        filter="url(#glow)"/>

  <!-- Corner Tech Accent Dot -->
  <circle cx="44" cy="18" r="2.5" fill="#bc13fe" />
</svg>
